  <polygon points="280,235 290,220 300,235" fill="#2D6A4F"/>
  <polygon points="250,255 258,242 266,255" fill="#40916C"/>
  
  <!-- Alt çimen -->
  <rect y="260" width="400" height="40" fill="#7CB342"/>
  <path d="M0,260 Q100,250 200,265 T400,260 L400,300 L0,300 Z" fill="#558B2F"/>
  
  <!-- Ağaçlar -->
  <polygon points="30,270 50,230 70,270" fill="#2D6A4F"/>
