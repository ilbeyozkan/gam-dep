<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gokyuzu3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9A8B"/>
      <stop offset="50%" stop-color="#FFB88C"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <linearGradient id="dag1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#A8A8A8"/>
      <stop offset="100%" stop-color="#4A4A4A"/>
    </linearGradient>
    <linearGradient id="dag2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0E0E0"/>
      <stop offset="100%" stop-color="#5D5D5D"/>
    </linearGradient>
  </defs>
  
  <!-- Gökyüzü (gün batımı) -->
  <rect width="400" height="300" fill="url(#gokyuzu3)"/>
  
  <!-- Güneş -->
  <circle cx="100" cy="100" r="35" fill="#FFEB3B"/>
  <circle cx="100" cy="100" r="50" fill="#FFEB3B" opacity="0.3"/>
  
  <!-- Uzak dağlar -->
  <polygon points="0,220 70,130 140,220" fill="url(#dag2)" opacity="0.7"/>
  <polygon points="260,220 340,120 400,220" fill="url(#dag2)" opacity="0.7"/>
  
  <!-- Ana dağ -->
  <polygon points="60,260 200,80 340,260" fill="url(#dag1)"/>
  
  <!-- Karlı zirve detayları -->
  <path d="M170,120 L200,80 L230,120 L210,115 L195,125 L180,115 Z" fill="#FFFFFF"/>
  
  <!-- Dağ gölgeleri -->
  <polygon points="200,80 340,260 270,260" fill="#3A3A3A" opacity="0.3"/>
  
  <!-- Yamaç bitkileri -->
