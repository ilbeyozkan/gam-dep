        </div>
    </div>
</div>

<script id="oyun-verisi" type="application/json">
{{ {"sorular": sorular, "bilgi": {"no": oyun.no, "ad": oyun.ad, "ana_no": ana_no, "ara_no": ara_no}} | tojson }}
</script>

<script>
console.log(">>> OYUN SCRIPT BAŞLADI <<<");

// ============================================
// SESLİ OKUMA (TTS)
// ============================================
function sesliOku(metin) {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    setTimeout(function () {
        const k = new SpeechSynthesisUtterance(metin);
        k.lang = "tr-TR";
        k.rate = 0.85;
        k.pitch = 1.1;
        k.volume = 1.0;
        window.speechSynthesis.speak(k);
    }, 120);
}

function sesliOkuSirayla(metinler) {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    let index = 0;
    function sonrakiniOku() {
        if (index >= metinler.length) return;
        const metin = metinler[index];
        const k = new SpeechSynthesisUtterance(metin);
        k.lang = "tr-TR";
        k.rate = (index === 0) ? 0.85 : 0.72;
        k.pitch = 1.1;
        k.volume = 1.0;
        k.onend = function () {
            index++;
            if (index < metinler.length) setTimeout(sonrakiniOku, 350);
        };
        window.speechSynthesis.speak(k);
    }
    setTimeout(sonrakiniOku, 150);
}

// ============================================
// SESLİ CEVAP (STT)
// ============================================
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let tanima = null;

if (SpeechRecognition) {
    tanima = new SpeechRecognition();
    tanima.lang = "tr-TR";
    tanima.continuous = false;
    tanima.interimResults = false;
    tanima.maxAlternatives = 5;
}

const TURKCE_SAYILAR = {
    "bir": 1, "iki": 2, "üç": 3, "uc": 3, "dört": 4, "dort": 4,
    "beş": 5, "bes": 5, "altı": 6, "alti": 6, "yedi": 7,
    "sekiz": 8, "dokuz": 9, "on": 10
};

function soylenenSayiyiBul(metin) {
    if (!metin) return null;
    const temiz = metin.toLowerCase().trim();
    const rakam = temiz.match(/\d+/);
    if (rakam) return parseInt(rakam[0]);
    for (const [kelime, sayi] of Object.entries(TURKCE_SAYILAR)) {
        if (temiz.includes(kelime)) return sayi;
    }
    return null;
}

// ============================================
// OYUN MOTORU
// ============================================
document.addEventListener("DOMContentLoaded", function () {
    console.log(">>> DOM HAZIR <<<");

    const oyunAlani = document.getElementById("oyun-alani");
    const veriEtiketi = document.getElementById("oyun-verisi");
    if (!oyunAlani || !veriEtiketi) {
        console.error("Gerekli elementler bulunamadı!");
        return;
    }

    let veri;
    try {
        veri = JSON.parse(veriEtiketi.textContent);
    } catch (e) {
        console.error("JSON hatası:", e);
        return;
    }

    const durum = {
        sorular: veri.sorular,
        bilgi: veri.bilgi,
        aktifSoru: 0,
        dogruSayisi: 0,
        cevaplandi: false,
        dinliyor: false,
    };

    soruyuGoster();

    // ----------------------------------------
    // SORU GÖSTER
    // ----------------------------------------
    function soruyuGoster() {
        const soru = durum.sorular[durum.aktifSoru];
        durum.cevaplandi = false;
        durum.dinliyor = false;

        document.getElementById("soru-no").textContent = durum.aktifSoru + 1;
        const yuzde = (durum.aktifSoru / durum.sorular.length) * 100;
        document.getElementById("ilerleme-dolgu").style.width = yuzde + "%";

        if (durum.bilgi.no === 1) {
            oyun1Ciz(soru);
        } else if (durum.bilgi.no === 2) {
            oyun2Ciz(soru);
        } else if (durum.bilgi.no === 9) {
            oyun9Ciz(soru);
        } else if (durum.bilgi.no === 3) {
            oyun3Ciz(soru);
        } else if (durum.bilgi.no === 4) {
            oyun4Ciz(soru);
        } else if (durum.bilgi.no === 7) {
            oyun7Ciz(soru);
        } else if (durum.bilgi.no === 8) {
            oyun8Ciz(soru);
        } else if (durum.bilgi.no === 10) {
            oyun10Ciz(soru);
        } else if (durum.bilgi.no === 11) {
            oyun11Ciz(soru);
        } else if (durum.bilgi.no === 12) {
            oyun12Ciz(soru);
        } else if (durum.bilgi.no === 13) {
            oyun13Ciz(soru);
        } else if (durum.bilgi.no === 14) {
            oyun14Ciz(soru);
        } else if (durum.bilgi.no === 15) {
            oyun15Ciz(soru);
        } else if (durum.bilgi.no === 16) {
            oyun16Ciz(soru);
        } else if (durum.bilgi.no === 5) {
            oyun5Ciz(soru);
        } else if (durum.bilgi.no === 6) {
            oyun6Ciz(soru);
        } else if (durum.bilgi.no === 17) {
            oyun17Ciz(soru);
        } else {
            oyunAlani.innerHTML = "<p>Bu oyun henüz hazır değil.</p>";

    // ----------------------------------------
    // OYUN 1: SÖZCÜK SAYMA
    // ----------------------------------------
    function oyun1Ciz(soru) {
        const secenekler = [2, 3, 4, 5];
        let html = '';
        html += '<p class="soru-yonerge">Aşağıdaki cümlede kaç sözcük var?</p>';
        html += '<div class="soru-metin">"' + soru.cumle + '"</div>';
        html += sesButonlariHTML();
        html += cevapGridHTML(secenekler);
        html += '<div class="geri-bildirim" id="geri-bildirim"></div>';
        oyunAlani.innerHTML = html;

        baglaButonlar(soru.cevap, function (verilen) {
            return cevapDegerlendir(verilen, soru.cevap, "sözcük");
        });

        document.getElementById("btn-konus").addEventListener("click", function () {
            sesliOkuSirayla(["Aşağıdaki cümlede kaç sözcük var?", soru.cumle]);
        });

        baglaMikrofon(soru);
        setTimeout(function () {
            sesliOkuSirayla(["Aşağıdaki cümlede kaç sözcük var?", soru.cumle]);
        }, 500);
    }
        // ----------------------------------------
    // OYUN 2: SÖZCÜK ATMA
    // ----------------------------------------
    function oyun2Ciz(soru) {
        // Cümleyi sözcük sözcük ayır, çıkarılanı üstü çizili yap
        const kelimeler = soru.cumle.split(" ");
        let cumleHTML = '';
        for (let i = 0; i < kelimeler.length; i++) {
            const k = kelimeler[i];
            const temizK = k.replace(/[.,!?]/g, "");
            if (temizK === soru.cikarilan) {
                cumleHTML += '<span class="cikarilan-kelime">' + k + '</span> ';
            } else {
                cumleHTML += '<span>' + k + '</span> ';
            }
        }

        let html = '';
        html += '<p class="soru-yonerge">Aşağıdaki cümleden <strong>"' + soru.cikarilan + '"</strong> çıkarıldığında kalan cümle hangisi olur?</p>';
        html += '<div class="soru-metin cumle-gosterim">' + cumleHTML + '</div>';
        html += '<div class="ses-butonlari">';
        html += '  <button class="ses-btn konus-btn" id="btn-konus">🔊 Tekrar Dinle</button>';
        html += '</div>';

        // Cümle seçenekleri
        html += '<div class="cumle-secenek-grid">';
        for (let i = 0; i < soru.secenekler.length; i++) {
            const s = soru.secenekler[i];
            html += '<button class="cumle-btn" data-cumle="' + s + '">' + s + '</button>';
        }
        html += '</div>';

        html += '<div class="fonem-gosterim" id="fonem-gosterim" style="display:none;"></div>';
        html += '<div class="geri-bildirim" id="geri-bildirim"></div>';
        oyunAlani.innerHTML = html;

        // Butonlar
        const butonlar = document.querySelectorAll(".cumle-btn");
        for (let i = 0; i < butonlar.length; i++) {
            const btn = butonlar[i];
            btn.addEventListener("click", function () {
                sozcukAtmaDegerlendir(this.dataset.cumle, soru);
            });
        }

        // 🔊 Dinle
        document.getElementById("btn-konus").addEventListener("click", function () {
            sesliOkuSirayla([
                soru.cumle,
                soru.cikarilan + " sözcüğü çıkarılınca hangi cümle kalır?"
            ]);
        });

        // Otomatik sesli oku
        setTimeout(function () {
            sesliOkuSirayla([
                soru.cumle,
                soru.cikarilan + " sözcüğü çıkarılınca hangi cümle kalır?"
            ]);
        }, 500);
    }

    // ----------------------------------------
    // SÖZCÜK ATMA DEĞERLENDİRME
    // ----------------------------------------
    function sozcukAtmaDegerlendir(verilen, soru) {
        if (durum.cevaplandi) return;
        durum.cevaplandi = true;

        const butonlar = document.querySelectorAll(".cumle-btn");
        const geriBildirim = document.getElementById("geri-bildirim");
        const gosterim = document.getElementById("fonem-gosterim");

        for (let i = 0; i < butonlar.length; i++) {
            const btn = butonlar[i];
            btn.disabled = true;
            if (btn.dataset.cumle === soru.kalan) btn.classList.add("dogru");
            else if (btn.dataset.cumle === verilen) btn.classList.add("yanlis");
        }

        gosterim.innerHTML = '<span class="hece-etiket">Kalan cümle:</span> ' +
                             '<strong>' + soru.kalan + '</strong>';
        gosterim.style.display = "block";

        if (verilen === soru.kalan) {
            durum.dogruSayisi++;
            geriBildirim.textContent = "✅ Doğru! Kalan cümle: " + soru.kalan;
            geriBildirim.classList.add("dogru");
            sesliOku("Doğru! Kalan cümle " + soru.kalan);
        } else {
            geriBildirim.textContent = "❌ Yanlış. Doğru cevap: " + soru.kalan;
            geriBildirim.classList.add("yanlis");
            sesliOku("Yanlış. Doğru cevap " + soru.kalan);
        }

        setTimeout(ilerle, 2200);
    }
        // ----------------------------------------
    // OYUN 3: SÖZCÜK BİRLEŞTİRME
    // ----------------------------------------
    function oyun3Ciz(soru) {
        // Karışık sözcükleri "chip" olarak göster
        let karisikHTML = '';
        for (let i = 0; i < soru.karisik.length; i++) {
            karisikHTML += '<span class="karisik-chip">' + soru.karisik[i] + '</span>';
        }

        let html = '';

        html += '<div class="ses-butonlari">';

        // Cümle seçenekleri
        html += '<div class="cumle-secenek-grid">';
        for (let i = 0; i < soru.secenekler.length; i++) {
            const s = soru.secenekler[i];

        html += '<div class="fonem-gosterim" id="fonem-gosterim" style="display:none;"></div>';
        html += '<div class="geri-bildirim" id="geri-bildirim"></div>';

        const butonlar = document.querySelectorAll(".cumle-btn");

            const btn = butonlar[i];

                "Aşağıdaki sözcüklerden anlamlı bir cümle hangisidir?",
                soru.karisik.join(", ")
            ]);
        });

        setTimeout(function () {
            sesliOkuSirayla([
                "Aşağıdaki sözcüklerden anlamlı bir cümle hangisidir?",
                soru.karisik.join(", ")
            ]);
        }, 500);
    }

    // ----------------------------------------
    // SÖZCÜK BİRLEŞTİRME DEĞERLENDİRME
    // ----------------------------------------
    function sozcukBirlestirmeDegerlendir(verilen, soru) {
        if (durum.cevaplandi) return;
        durum.cevaplandi = true;

        const butonlar = document.querySelectorAll(".cumle-btn");
        const geriBildirim = document.getElementById("geri-bildirim");
        const gosterim = document.getElementById("fonem-gosterim");

        for (let i = 0; i < butonlar.length; i++) {
            const btn = butonlar[i];
            btn.disabled = true;
            if (btn.dataset.cumle === soru.dogru) btn.classList.add("dogru");
            else if (btn.dataset.cumle === verilen) btn.classList.add("yanlis");
        }

        gosterim.innerHTML = '<span class="hece-etiket">Doğru cümle:</span> ' +
                             '<strong>' + soru.dogru + '</strong>';
        gosterim.style.display = "block";

        if (verilen === soru.dogru) {
            durum.dogruSayisi++;
            geriBildirim.textContent = "✅ Doğru! " + soru.dogru;
            geriBildirim.classList.add("dogru");
            sesliOku("Doğru! " + soru.dogru);
        } else {
            geriBildirim.textContent = "❌ Yanlış. Doğru cevap: " + soru.dogru;
            geriBildirim.classList.add("yanlis");
            sesliOku("Yanlış. Doğru cevap " + soru.dogru);
        }

        setTimeout(ilerle, 2200);
    }
        // ----------------------------------------
    // OYUN 4: SÖZCÜK AYIRMA (Çoklu Seçim)
    // ----------------------------------------
    function oyun4Ciz(soru) {
        // Tüm seçenekleri karıştır: doğru kelimeler + tuzaklar
        const tumSecenekler = soru.dogru_kelimeler.concat(soru.tuzak);
        // Karıştır
        for (let i = tumSecenekler.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [tumSecenekler[i], tumSecenekler[j]] = [tumSecenekler[j], tumSecenekler[i]];
        }

        let html = '';
        html += '<p class="soru-yonerge">Aşağıdaki cümlede <strong>hangi sözcükler</strong> var? (Birden fazla seç)</p>';
        html += '<div class="soru-metin">' + soru.cumle + '</div>';
        html += '<div class="ses-butonlari">';
        html += '  <button class="ses-btn konus-btn" id="btn-konus">🔊 Tekrar Dinle</button>';
        html += '</div>';

        // Seçim chip'leri
        html += '<div class="secim-grid">';
        for (let i = 0; i < tumSecenekler.length; i++) {
            const s = tumSecenekler[i];
            html += '<button class="secim-chip" data-kelime="' + s + '">' + s + '</button>';
        }
        html += '</div>';

        // Onayla butonu
        html += '<div class="onayla-alani">';
        html += '  <button class="onayla-btn" id="btn-onayla" disabled>✓ Onayla</button>';
        html += '  <div class="secim-bilgi" id="secim-bilgi">Hiç seçim yapmadın</div>';
        html += '</div>';

        html += '<div class="fonem-gosterim" id="fonem-gosterim" style="display:none;"></div>';
        html += '<div class="geri-bildirim" id="geri-bildirim"></div>';
        oyunAlani.innerHTML = html;

        // Seçim chip'lerine tıklama (toggle)
        const chipButonlar = document.querySelectorAll(".secim-chip");
        const secimBilgi = document.getElementById("secim-bilgi");
        const onaylaBtn = document.getElementById("btn-onayla");

        for (let i = 0; i < chipButonlar.length; i++) {
            const btn = chipButonlar[i];
            btn.addEventListener("click", function () {
                this.classList.toggle("secili");
                const secilenler = document.querySelectorAll(".secim-chip.secili");
                secimBilgi.textContent = secilenler.length + " sözcük seçtin";
                onaylaBtn.disabled = (secilenler.length === 0);
            });
        }

        // Onayla butonu
        onaylaBtn.addEventListener("click", function () {
            const secilenler = [];
            const hepsi = document.querySelectorAll(".secim-chip.secili");
            for (let i = 0; i < hepsi.length; i++) {
                secilenler.push(hepsi[i].dataset.kelime);
            }
            sozcukAyirmaDegerlendir(secilenler, soru);
        });

        // 🔊 Dinle
        document.getElementById("btn-konus").addEventListener("click", function () {
            sesliOkuSirayla([
                "Aşağıdaki cümlede hangi sözcükler var?",
                soru.cumle
            ]);
        });

        // Otomatik sesli oku
        setTimeout(function () {
            sesliOkuSirayla([
                "Aşağıdaki cümlede hangi sözcükler var?",
                soru.cumle
            ]);
        }, 500);
    }

    // ----------------------------------------
    // SÖZCÜK AYIRMA DEĞERLENDİRME
    // ----------------------------------------
    function sozcukAyirmaDegerlendir(secilenler, soru) {
        if (durum.cevaplandi) return;
        durum.cevaplandi = true;

        // Seçimleri karşılaştır (sırayı önemseme)
        const secilenSet = new Set(secilenler);
        const dogruSet = new Set(soru.dogru_kelimeler);

        let tamDogru = (secilenSet.size === dogruSet.size);
        if (tamDogru) {
            for (const k of secilenSet) {
                if (!dogruSet.has(k)) {
                    tamDogru = false;
                    break;
                }
            }
        }

        // Görsel: doğru seçilenler yeşil, yanlış seçilenler kırmızı
        const chipButonlar = document.querySelectorAll(".secim-chip");
        for (let i = 0; i < chipButonlar.length; i++) {
            const btn = chipButonlar[i];
            btn.disabled = true;
            const k = btn.dataset.kelime;
            const secili = secilenSet.has(k);
            const dogruMu = dogruSet.has(k);

            if (secili && dogruMu) {
                btn.classList.remove("secili");
                btn.classList.add("dogru");
            } else if (secili && !dogruMu) {
                btn.classList.remove("secili");
                btn.classList.add("yanlis");
            } else if (!secili && dogruMu) {
                // Seçilmeyen doğru → kaçırdı (sarı)
                btn.classList.add("kacirdi");
            }
        }

        const geriBildirim = document.getElementById("geri-bildirim");
        const gosterim = document.getElementById("fonem-gosterim");

        gosterim.innerHTML = '<span class="hece-etiket">Doğru sözcükler:</span> ' +
                             '<strong>' + soru.dogru_kelimeler.join(" • ") + '</strong>';
        gosterim.style.display = "block";

        if (tamDogru) {
            durum.dogruSayisi++;
            geriBildirim.textContent = "✅ Doğru! Cümlede " + soru.dogru_kelimeler.length + " sözcük var.";
            geriBildirim.classList.add("dogru");
            sesliOku("Doğru! " + soru.dogru_kelimeler.join(" "));
        } else {
            geriBildirim.textContent = "❌ Eksik veya yanlış seçim. Doğru sözcükler: " + soru.dogru_kelimeler.join(", ");
            geriBildirim.classList.add("yanlis");
            sesliOku("Yanlış. Doğru sözcükler: " + soru.dogru_kelimeler.join(" "));
        }

        setTimeout(ilerle, 2600);
    }
        // ----------------------------------------
    // OYUN 9: FONEM AYIRT ETME
    // ----------------------------------------
    function oyun9Ciz(soru) {
        // 3 sözcüğü yan yana kart olarak göster
        let kartlarHTML = '';
        for (let i = 0; i < soru.sozcukler.length; i++) {
            const s = soru.sozcukler[i];

        html += '<div class="ayirt-grid">' + kartlarHTML + '</div>';
        html += '<div class="ses-butonlari">';
        html += '  <button class="ses-btn konus-btn" id="btn-konus">🔊 Sözcükleri Dinle</button>';
        html += '</div>';

        html += '<div class="fonem-gosterim" id="fonem-gosterim" style="display:none;"></div>';
        html += '<div class="geri-bildirim" id="geri-bildirim"></div>';
        oyunAlani.innerHTML = html;

        const butonlar = document.querySelectorAll(".ayirt-kart");
        for (let i = 0; i < butonlar.length; i++) {
            const btn = butonlar[i];
            btn.addEventListener("click", function () {
                fonemAyirtDegerlendir(this.dataset.kelime, soru);
            });
        }

        // 🔊 Dinle - 3 sözcüğü sırayla okur
        document.getElementById("btn-konus").addEventListener("click", function () {
            const sira = ["Hangisi diğerlerinden farklı sesle başlıyor?"];
            for (let i = 0; i < soru.sozcukler.length; i++) {
                sira.push(soru.sozcukler[i]);

    // ----------------------------------------
    // KAFİYE ÜRETME DEĞERLENDİRME
    // ----------------------------------------
    function kafiyeUretDegerlendir(secilenler, soru) {
        if (durum.cevaplandi) return;
        durum.cevaplandi = true;

        const secilenSet = new Set(secilenler);
        const dogruSet = new Set(soru.dogrular);

        let tamDogru = (secilenSet.size === dogruSet.size);
        if (tamDogru) {
            for (const k of secilenSet) {
                if (!dogruSet.has(k)) {
                    tamDogru = false;
                    break;
                }
            }
        }

        const chipButonlar = document.querySelectorAll(".secim-chip");
        for (let i = 0; i < chipButonlar.length; i++) {
            const btn = chipButonlar[i];
            btn.disabled = true;
            const k = btn.dataset.kelime;
            const secili = secilenSet.has(k);
            const dogruMu = dogruSet.has(k);

            if (secili && dogruMu) {
                btn.classList.remove("secili");
                btn.classList.add("dogru");
            } else if (secili && !dogruMu) {
                btn.classList.remove("secili");
                btn.classList.add("yanlis");
            } else if (!secili && dogruMu) {
                btn.classList.add("kacirdi");
            }
        }

        const geriBildirim = document.getElementById("geri-bildirim");
        const gosterim = document.getElementById("fonem-gosterim");

        gosterim.innerHTML = '<span class="hece-etiket">Kafiyeli sözcükler:</span> ' +
                             '<strong>' + soru.dogrular.join(" • ") + '</strong>';
        gosterim.style.display = "block";

        if (tamDogru) {
            durum.dogruSayisi++;
            geriBildirim.textContent = "✅ Doğru! " + soru.dogrular.length + " kafiyeli sözcük buldun.";
            geriBildirim.classList.add("dogru");
            sesliOku("Doğru! " + soru.dogrular.join(" "));
        } else {
            geriBildirim.textContent = "❌ Eksik veya yanlış seçim. Doğru sözcükler: " + soru.dogrular.join(", ");
            geriBildirim.classList.add("yanlis");
            sesliOku("Yanlış. Doğru sözcükler " + soru.dogrular.join(" "));
        }

        setTimeout(ilerle, 2600);
    }

    function baglaButonlar(dogru, cb) {
        const butonlar = document.querySelectorAll(".cevap-btn");
        for (let i = 0; i < butonlar.length; i++) {
            const btn = butonlar[i];
            btn.addEventListener("click", function () {
                cb(parseInt(this.dataset.cevap));
            });
        }
    }

    function baglaMikrofon(soru) {
        const mikrofonBtn = document.getElementById("btn-mikrofon");
        if (!tanima) {
            mikrofonBtn.disabled = true;
            mikrofonBtn.textContent = "🎤 Desteklenmiyor";
            return;
        }
        mikrofonBtn.addEventListener("click", function () {
            mikrofonDinle(soru.cevap);
        });
    }

    // ----------------------------------------
    // CEVAP DEĞERLENDİRME - OYUN 1
    // ----------------------------------------
    function cevapDegerlendir(verilen, dogru, birim) {
        if (durum.cevaplandi) return;
        durum.cevaplandi = true;
        if (durum.dinliyor && tanima) {
            try { tanima.stop(); } catch (e) {}
        }

        const butonlar = document.querySelectorAll(".cevap-btn");
        const geriBildirim = document.getElementById("geri-bildirim");
        for (let i = 0; i < butonlar.length; i++) {
            const btn = butonlar[i];
            btn.disabled = true;
            const deger = parseInt(btn.dataset.cevap);
            if (deger === dogru) btn.classList.add("dogru");
            else if (deger === verilen) btn.classList.add("yanlis");
        }

        if (verilen === dogru) {
            durum.dogruSayisi++;
            geriBildirim.textContent = "✅ Doğru! Harika!";
            geriBildirim.classList.add("dogru");
            sesliOku("Doğru!");
        } else {
            geriBildirim.textContent = "❌ Yanlış. Doğru cevap: " + dogru;
            geriBildirim.classList.add("yanlis");
            sesliOku("Yanlış. Doğru cevap " + dogru);
        }

        ilerle();
    }

    // ----------------------------------------
    // CEVAP DEĞERLENDİRME - OYUN 7
    // ----------------------------------------
    function heceDegerlendir(verilen, soru) {
        if (durum.cevaplandi) return;
        durum.cevaplandi = true;
        if (durum.dinliyor && tanima) {
            try { tanima.stop(); } catch (e) {}
        }

        const butonlar = document.querySelectorAll(".cevap-btn");
        const geriBildirim = document.getElementById("geri-bildirim");
        const heceGosterim = document.getElementById("hece-gosterim");

        for (let i = 0; i < butonlar.length; i++) {
            const btn = butonlar[i];
            btn.disabled = true;
            const deger = parseInt(btn.dataset.cevap);
            if (deger === soru.cevap) btn.classList.add("dogru");
            else if (deger === verilen) btn.classList.add("yanlis");
        }

        const heceMetni = soru.heceler.join(" - ");
        heceGosterim.innerHTML = '<span class="hece-etiket">Heceler:</span> <strong>' + heceMetni + '</strong>';
        heceGosterim.style.display = "block";

        if (verilen === soru.cevap) {
            durum.dogruSayisi++;
            geriBildirim.textContent = "✅ Doğru! " + soru.sozcuk + " = " + heceMetni;
            geriBildirim.classList.add("dogru");
            sesliOku("Doğru! " + soru.sozcuk + " " + soru.heceler.join(" "));
        } else {
            geriBildirim.textContent = "❌ Yanlış. Doğru cevap: " + soru.cevap;
            geriBildirim.classList.add("yanlis");
            sesliOku("Yanlış. Doğru cevap " + soru.cevap + ". " + soru.sozcuk + " " + soru.heceler.join(" "));
        }

        setTimeout(ilerle, 2400);
    }

    function ilerle() {
        durum.aktifSoru++;
        if (durum.aktifSoru < durum.sorular.length) {
            soruyuGoster();
        } else {
            oyunuBitir();
        }
    }
        // ----------------------------------------
    // OYUN 8: HECE SİLME
    // ----------------------------------------
    function oyun8Ciz(soru) {
        // Sözcüğün hecelerini renkli chip'ler olarak göster
        let hecelerHTML = '';
        for (let i = 0; i < soru.heceler.length; i++) {
            const hece = soru.heceler[i];
            if (hece === soru.cikarilan) {
                // Çıkarılan hece: kırmızı, üstü çizili
                hecelerHTML += '<span class="hece-chip hece-cikarilan">' + hece + '</span>';
            } else {
                hecelerHTML += '<span class="hece-chip">' + hece + '</span>';
            }
            if (i < soru.heceler.length - 1) {
                hecelerHTML += '<span class="hece-arti">-</span>';
            }
        }

        let html = '';
        html += '<p class="soru-yonerge">Sözcükten <strong>"' + soru.cikarilan + '"</strong> hecesi çıkarılınca ne kalır?</p>';
        html += '<div class="soru-metin soru-metin-buyuk">' + soru.sozcuk + '</div>';
        html += '<div class="hece-kutu">' + hecelerHTML + '</div>';
        html += '<div class="ses-butonlari">';
        html += '  <button class="ses-btn konus-btn" id="btn-konus">🔊 Tekrar Dinle</button>';
        html += '</div>';

        // Cevap seçenekleri
        html += '<div class="kafiye-grid">';
        for (let i = 0; i < soru.secenekler.length; i++) {
            const s = soru.secenekler[i];
            html += '<button class="kafiye-btn" data-kelime="' + s + '">' + s + '</button>';
        }
        html += '</div>';

        html += '<div class="fonem-gosterim" id="fonem-gosterim" style="display:none;"></div>';
        html += '<div class="geri-bildirim" id="geri-bildirim"></div>';
        oyunAlani.innerHTML = html;

        const butonlar = document.querySelectorAll(".kafiye-btn");
        for (let i = 0; i < butonlar.length; i++) {
            const btn = butonlar[i];
            btn.addEventListener("click", function () {
                heceSilmeDegerlendir(this.dataset.kelime, soru);
            });
        }

        // 🔊 Dinle: önce sözcük, sonra heceler, sonra soru
        document.getElementById("btn-konus").addEventListener("click", function () {
            const sira = [soru.sozcuk];
            sira.push(soru.heceler.join(", "));
            sira.push(soru.cikarilan + " hecesi çıkarılınca ne kalır?");
            sesliOkuSirayla(sira);
        });

        // Otomatik sesli oku
        setTimeout(function () {
            const sira = [soru.sozcuk];
            sira.push(soru.heceler.join(", "));
            sira.push(soru.cikarilan + " hecesi çıkarılınca ne kalır?");
            sesliOkuSirayla(sira);
        }, 500);
    }

    // ----------------------------------------
    // HECE SİLME DEĞERLENDİRME
    // ----------------------------------------
    function heceSilmeDegerlendir(verilen, soru) {
        if (durum.cevaplandi) return;
        durum.cevaplandi = true;

        const butonlar = document.querySelectorAll(".kafiye-btn");
        const geriBildirim = document.getElementById("geri-bildirim");
        const gosterim = document.getElementById("fonem-gosterim");

        for (let i = 0; i < butonlar.length; i++) {
            const btn = butonlar[i];
            btn.disabled = true;
            if (btn.dataset.kelime === soru.kalan) btn.classList.add("dogru");
            else if (btn.dataset.kelime === verilen) btn.classList.add("yanlis");
        }

        gosterim.innerHTML = '<span class="hece-etiket">Kalan:</span> ' +
                             '<strong>' + soru.sozcuk + ' → ' + soru.kalan + '</strong>';
        gosterim.style.display = "block";

        if (verilen === soru.kalan) {
            durum.dogruSayisi++;
            geriBildirim.textContent = "✅ Doğru! " + soru.sozcuk + " - " + soru.cikarilan + " = " + soru.kalan;
            geriBildirim.classList.add("dogru");
            sesliOku("Doğru! Kalan " + soru.kalan);
        } else {
            geriBildirim.textContent = "❌ Yanlış. Doğru cevap: " + soru.kalan;
            geriBildirim.classList.add("yanlis");
            sesliOku("Yanlış. Doğru cevap " + soru.kalan);
        }

        setTimeout(ilerle, 2400);
    }

    // ----------------------------------------
    // MİKROFON
    // ----------------------------------------
    function mikrofonDinle(dogruCevap) {
        if (durum.cevaplandi || durum.dinliyor) return;

        const durumAlani = document.getElementById("mikrofon-durum");
        const mikrofonBtn = document.getElementById("btn-mikrofon");

        durum.dinliyor = true;
        mikrofonBtn.classList.add("dinliyor");
        mikrofonBtn.textContent = "🎤 Dinliyorum...";
        durumAlani.textContent = "Cevabını söyle: (bir, iki, üç, dört)";
        durumAlani.className = "mikrofon-durum aktif";

        tanima.onresult = function (olay) {
            const sonuclar = olay.results[0];
            let bulunanSayi = null;
            let soylenenMetin = "";

            for (let i = 0; i < sonuclar.length; i++) {
                const metin = sonuclar[i].transcript;
                soylenenMetin = metin;
                const sayi = soylenenSayiyiBul(metin);
                if (sayi !== null) {
                    bulunanSayi = sayi;
                    break;
                }
            }

            durum.dinliyor = false;
            mikrofonBtn.classList.remove("dinliyor");
            mikrofonBtn.textContent = "🎤 Sesli Cevap";

            if (bulunanSayi !== null) {
                durumAlani.textContent = "Anladım: " + bulunanSayi;
                durumAlani.className = "mikrofon-durum basarili";

                if (durum.bilgi.no === 7) {
                    heceDegerlendir(bulunanSayi, durum.sorular[durum.aktifSoru]);
                } else {
                    cevapDegerlendir(bulunanSayi, dogruCevap, "sözcük");
                }
            } else {
                durumAlani.textContent = "Anlayamadım: \"" + soylenenMetin + "\"";
                durumAlani.className = "mikrofon-durum hatali";
            }
        };

        tanima.onerror = function (olay) {
            durum.dinliyor = false;
            mikrofonBtn.classList.remove("dinliyor");
            mikrofonBtn.textContent = "🎤 Sesli Cevap";
            durumAlani.textContent = "Mikrofon hatası: " + olay.error;
            durumAlani.className = "mikrofon-durum hatali";
        };

        tanima.onend = function () {
            durum.dinliyor = false;
            mikrofonBtn.classList.remove("dinliyor");
            mikrofonBtn.textContent = "🎤 Sesli Cevap";
        };

        try { tanima.start(); } catch (e) {
            durumAlani.textContent = "Mikrofon başlatılamadı.";
            durumAlani.className = "mikrofon-durum hatali";
        }
    }

    // ----------------------------------------
    // OYUN BİTİR
    // ----------------------------------------
        function oyunuBitir() {
        const toplam = durum.sorular.length;
        const dogru = durum.dogruSayisi;
        let yildiz = 0;
        if (dogru === toplam) yildiz = 3;
        else if (dogru >= toplam - 1) yildiz = 2;
        else if (dogru >= Math.ceil(toplam / 2)) yildiz = 1;

        document.getElementById("oyun-alani").style.display = "none";
        document.querySelector(".oyun-ilerleme-bar").style.display = "none";
        document.getElementById("sonuc-ekrani").style.display = "block";

        const emoji = document.getElementById("sonuc-emoji");
        const baslik = document.getElementById("sonuc-baslik");
        const mesaj = document.getElementById("sonuc-mesaj");

        if (yildiz === 3) { emoji.textContent = "🏆"; baslik.textContent = "Mükemmel!"; mesaj.textContent = toplam + " sorudan " + dogru + "'ini doğru bildin!"; }
        else if (yildiz === 2) { emoji.textContent = "🎉"; baslik.textContent = "Çok İyi!"; mesaj.textContent = toplam + " sorudan " + dogru + "'ini doğru bildin."; }
        else if (yildiz === 1) { emoji.textContent = "👍"; baslik.textContent = "Güzel Deneme!"; mesaj.textContent = toplam + " sorudan " + dogru + "'ini doğru bildin."; }
        else { emoji.textContent = "💪"; baslik.textContent = "Tekrar Dene!"; mesaj.textContent = toplam + " sorudan " + dogru + "'ini doğru bildin."; }

        // Yıldızları oluştur
        const yildizAlani = document.getElementById("sonuc-yildizlar");
        let yildizHtml = "";
        for (let i = 0; i < 3; i++) {
            yildizHtml += (i < yildiz) ? '<span class="kazanildi">⭐</span>' : '<span class="kazanilmadi">⭐</span>';
        }
        yildizAlani.innerHTML = yildizHtml;

        // ⭐ YENİ: Yıldız kazanınca animasyonlar
        if (yildiz > 0) {
            // 1) Uçan "+X ⭐" yazısı
            setTimeout(function () {
                ucanYildizGoster(yildiz);
            }, 400);

            // 2) Yıldız patlaması
            setTimeout(function () {
                yildizPatlamasi();
            }, 700);

            // 3) Konfeti yağmuru
            setTimeout(function () {
                konfetiYagdir();
            }, 500);

            // 4) Zafer sesi (opak, sessizce)
            setTimeout(function () {
                sesliOku(baslik.textContent + " " + mesaj.textContent + " " + yildiz + " yıldız kazandın!");
            }, 1200);
        } else {
            // Yıldız yoksa sadece sonucu oku
            setTimeout(function () {
                sesliOku(baslik.textContent + " " + mesaj.textContent);
            }, 600);
        }

        sonucuKaydet(yildiz, dogru, toplam);
    }

    // ----------------------------------------
    // SUNUCUYA KAYDET
    // ----------------------------------------
    function sonucuKaydet(yildiz, dogru, toplam) {
        if (yildiz === 0) return;
        const veri = {
            ana_bolum: durum.bilgi.ana_no,
            ara_bolum: durum.bilgi.ara_no,
            oyun_no: durum.bilgi.no,
            yildiz: yildiz,
            dogru: dogru,
            toplam: toplam,
        };
        fetch("/oyun/kaydet", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(veri),
        })
            .then(function (r) { return r.json(); })
            .then(function (c) {
                if (c.yeni_rozetler && c.yeni_rozetler.length > 0) {
                    rozetKutlamasiGoster(c.yeni_rozetler);
                }
            })
            .catch(function (h) { console.error("Kayıt hatası:", h); });
    }

    // ----------------------------------------
    // ROZET POPUP
    // ----------------------------------------
    function rozetKutlamasiGoster(rozetler) {
        setTimeout(function () {
            sesliOku("Tebrikler! Yeni bir rozet kazandın!");
        }, 500);

        const popup = document.createElement("div");
        popup.className = "rozet-popup";
        let h = '<div class="rozet-popup-icerik">';
        h += '<div class="rozet-popup-emoji">🏅</div>';
        h += '<h3>Yeni Rozet Kazandın!</h3>';
        for (let i = 0; i < rozetler.length; i++) {
            h += '<div class="rozet-popup-isim">🏅 ' + rozetler[i] + '</div>';
        }
        h += '<button class="rozet-popup-btn" id="rozet-kapat">Harika! 🎉</button>';
        h += '</div>';
        popup.innerHTML = h;
        document.body.appendChild(popup);

        document.getElementById("rozet-kapat").addEventListener("click", function () {
            popup.remove();
        });
    }
});
// ============================================
// KONFETİ + YILDIZ PATLAMASI EFEKTİ
// ============================================

function konfetiYagdir() {
    // 60 adet konfeti oluştur
    const renkler = ["#ffd54f", "#f39c12", "#e74c3c", "#9b59b6", "#3498db", "#27ae60", "#1abc9c"];

    for (let i = 0; i < 60; i++) {
        const konfeti = document.createElement("div");
        konfeti.className = "konfeti-parca";
        konfeti.style.left = Math.random() * 100 + "%";
        konfeti.style.backgroundColor = renkler[Math.floor(Math.random() * renkler.length)];
        konfeti.style.animationDelay = (Math.random() * 0.8) + "s";
        konfeti.style.animationDuration = (2 + Math.random() * 1.5) + "s";
        konfeti.style.width = (6 + Math.random() * 8) + "px";
        konfeti.style.height = (6 + Math.random() * 8) + "px";
        konfeti.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
        konfeti.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";

        document.body.appendChild(konfeti);

        // 4 saniye sonra temizle
        setTimeout(function () {
            konfeti.remove();
        }, 4000);
    }
}

function yildizPatlamasi() {
    // Sonuç ekranındaki yıldızların konumlarında patlama efekti
    const yildizlar = document.querySelectorAll(".sonuc-yildizlar .kazanildi");
    if (!yildizlar.length) return;

    yildizlar.forEach(function (yildiz, index) {
        setTimeout(function () {
            const patlama = document.createElement("div");
            patlama.className = "yildiz-patlama";
            patlama.textContent = "✨";

            const rect = yildiz.getBoundingClientRect();
            patlama.style.position = "fixed";
            patlama.style.left = rect.left + "px";
            patlama.style.top = rect.top + "px";
            patlama.style.fontSize = "50px";
            patlama.style.zIndex = "9999";
            patlama.style.pointerEvents = "none";
            patlama.style.animation = "yildizPatlamaAnim 0.8s ease forwards";

            document.body.appendChild(patlama);

            setTimeout(function () {
                patlama.remove();
            }, 1000);
        }, index * 250);
    });
}

function ucanYildizGoster(miktar) {
    if (miktar <= 0) return;

    const balon = document.createElement("div");
    balon.className = "ucan-yildiz";
    balon.innerHTML = "+" + miktar + " ⭐";

    // Ekranın ortasına konumlandır
    balon.style.position = "fixed";
    balon.style.left = "50%";
    balon.style.top = "40%";
    balon.style.transform = "translate(-50%, -50%)";
    balon.style.fontSize = "48px";
    balon.style.fontWeight = "900";
    balon.style.color = "#ffd54f";
    balon.style.textShadow = "3px 3px 12px rgba(243, 156, 18, 0.9)";
    balon.style.zIndex = "9999";
    balon.style.pointerEvents = "none";
    balon.style.animation = "ucanYildizAnim 2.5s ease forwards";

    document.body.appendChild(balon);

    setTimeout(function () {
        balon.remove();
    }, 3000);
}
</script>
